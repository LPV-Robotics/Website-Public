name: Promote to Production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote staging to production
        env:
          PAT: ${{ secrets.PAT_PRODUCTION }}
        run: |
          # Remove default GITHUB_TOKEN extraheader that overrides PAT
          git config --local --unset-all http.https://github.com/.extraheader || true

          # Configure PAT auth for production repo
          git config --global credential.https://github.com.username x-access-token
          git config --global credential.https://github.com.helper "!f() { echo password=${PAT}; }; f"

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote add staging-repo https://github.com/LPV-Robotics/Website-Public-Staging.git
          git remote add production-repo https://github.com/LPV-Robotics/Website-Public.git
          git fetch staging-repo main
          git fetch production-repo main
          git checkout -B promote production-repo/main
          git merge --no-ff --allow-unrelated-histories --strategy-option=theirs staging-repo/main -m "chore: promote staging to production"
          git push production-repo HEAD:main