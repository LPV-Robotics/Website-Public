name: Promote to Production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to production repo
        env:
          PAT: ${{ secrets.PAT_PRODUCTION }}
        run: |
          git remote add production https://x-access-token:${PAT}@github.com/LPV-Robotics/Website-Public.git
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch production main
          git checkout production/main
          git merge --no-ff --strategy-option=theirs origin/main -m "chore: promote staging → production"
          git push production HEAD:main