name: Sync main → staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Push to staging repo
        env:
          PAT: ${{ secrets.STAGING_PAT }}
        run: |
          git remote add staging-repo https://x-access-token:${PAT}@github.com/LPV-Robotics/Website-Public-Staging.git
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git push staging-repo --force HEAD:main